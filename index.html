<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>4Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="score-top" class="score-top"></div>

<div id="selector" class="form-card card-animated">
  <form id="quiz-form">

    <fieldset>
      <legend>ゲーム種別</legend>
      <div id="game-buttons" class="button-group">
        <button type="button" class="select-button" data-value="LOL" onclick="selectGame('LOL')">League of Legends</button>

        <!-- 後で復活可能
        <button type="button" class="select-button" data-value="APEX" onclick="selectGame('APEX')">Apex Legends</button>
        <button type="button" class="select-button" data-value="OW2" onclick="selectGame('OW2')">Overwatch 2</button>
        <button type="button" class="select-button" data-value="ST6" onclick="selectGame('ST6')">STREET FIGHTER 6</button>
        <button type="button" class="select-button" data-value="VALO" onclick="selectGame('VALO')">VALORANT</button>
        -->
      </div>
    </fieldset>

    <div id="quiz-settings" style="display: none;">

      <fieldset>
        <legend>問題カテゴリ</legend>
        <div class="radio-group" id="difficulty-area">
          <!-- ゲーム選択後にJSで表示 -->
        </div>
      </fieldset>

      <fieldset>
        <legend>問題数</legend>
        <div class="radio-group">
          <label><input type="radio" name="amount" value="all" checked> すべて</label>
          <label><input type="radio" name="amount" value="10"> 10問</label>
        </div>
      </fieldset>

      <div class="control">
        <button type="button" onclick="submitSelection()">スタート</button>
      </div>

    </div>

    <div class="footer-links" style="margin-top: 10px; font-size: 12px;">
      <a href="privacy.html" target="_blank" style="margin-right: 20px;">プライバシーポリシー</a>
      <a href="https://docs.google.com/forms/d/1Eqcl3HLWspbqWoWGNSd4S-dQXpBfz89P79axQl8FqW4/edit?hl=ja&pli=1#settings" target="_blank">
        <button type="button" style="font-size: 12px; padding: 6px 12px; width: auto;">お問い合わせ</button>
      </a>
    </div>

  </form>
</div>

<div id="quiz-area" style="display: none;">
  <div class="question" id="question"></div>
  <div id="choices" class="choices"></div>
  <div id="feedback"></div>

  <div id="end-button-area" class="end-button-area">
    <button id="end-quiz-button" onclick="forceEndQuiz()">終了する</button>
  </div>

  <div id="control" class="control"></div>
  <div id="details" class="form-card" style="margin-top:20px; display: none;"></div>
</div>

<script>
  let selectedGame = "";

  const gameDifficultyMap = {
    LOL: [
      { label: "すべて", value: "all" },
      { label: "初級", value: "normal" },
      { label: "中級", value: "hard" },
      { label: "上級", value: "veryhard" },
      { label: "26.11", value: "26.11" }
    ],

    // 後で復活用
    /*
    APEX: [
      { label: "すべて", value: "all" },
      { label: "最新アップデート", value: "latest" }
    ],
    OW2: [
      { label: "すべて", value: "all" },
      { label: "最新アップデート", value: "latest" }
    ],
    ST6: [
      { label: "すべて", value: "all" },
      { label: "最新アップデート", value: "latest" }
    ],
    VALO: [
      { label: "すべて", value: "all" },
      { label: "最新アップデート", value: "latest" }
    ]
    */
  };

  function selectGame(gameKey) {
    selectedGame = gameKey;

    document.querySelectorAll(".select-button").forEach(button => {
      button.classList.remove("selected");
    });

    document.querySelector(`.select-button[data-value="${gameKey}"]`).classList.add("selected");

    const difficultyArea = document.getElementById("difficulty-area");
    difficultyArea.innerHTML = "";

    gameDifficultyMap[gameKey].forEach((item, index) => {
      const checked = index === 0 ? "checked" : "";
      difficultyArea.innerHTML += `
        <label>
          <input type="radio" name="difficulty" value="${item.value}" ${checked}>
          ${item.label}
        </label>
      `;
    });

    document.getElementById("quiz-settings").style.display = "block";
  }
</script>

<script src="main.js" defer></script>
</body>
</html>
